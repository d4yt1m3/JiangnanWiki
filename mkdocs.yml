site_name: JiangnanWiki
site_description: 江南大学学习与生活知识库
site_author: d4yt1m3
site_url: https://d4yt1m3.github.io/JiangnanWiki/
repo_url: https://github.com/d4yt1m3/JiangnanWiki
repo_name: d4yt1m3/JiangnanWiki

theme:
  name: material
  language: zh
  logo: assets/images/jiangnan-university-logo.png
  favicon: assets/images/jiangnan-university-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Welcome: index.md

plugins:
  - search:
      lang:
        - zh
        - en
